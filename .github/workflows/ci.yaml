name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: host unit tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Check code style
        run: make format-check

      - name: Run unit tests
        run: make clean && make test

      - name: Run sanitizer build
        run: make sanitize

  unikraft-x86_64:
    name: unikraft build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex build-essential

      - name: Install KraftKit
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get.kraftkit.sh | sudo sh -s -- -y || {
            KRAFTKIT_VERSION=$(curl -fsSL https://get.kraftkit.sh/latest.txt 2>/dev/null || echo "0.12.15")
            curl -fsSL "https://github.com/unikraft/kraftkit/releases/download/v${KRAFTKIT_VERSION}/kraftkit_${KRAFTKIT_VERSION}_linux_amd64.deb" -o /tmp/kraftkit.deb
            sudo dpkg -i /tmp/kraftkit.deb
            rm -f /tmp/kraftkit.deb
          }
          echo "KRAFTKIT_NO_CHECK_UPDATES=true" >> "$GITHUB_ENV"
          kraft version

      - name: Configure KraftKit manifests
        run: |
          kraft pkg source https://manifests.kraftkit.sh/index.yaml
          kraft pkg update

      - name: Build ENA application for KVM/QEMU x86_64
        run: |
          kraft build --no-prompt --log-type basic --target kvm --plat qemu --arch x86_64 examples/ci-app < /dev/null

  # No arm64 build job here. The driver reads PCI config space with x86 port
  # I/O, so it builds only for x86_64. Ticket 658166ee81 tracks the ECAM
  # path, and ticket 49a6bea44f re-adds an arm64 job when that work lands.

  unikraft-mc-x86_64:
    name: unikraft multi-core build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison flex build-essential

      - name: Fetch pinned Unikraft source
        run: |
          git clone https://github.com/unikraft/unikraft.git samples/httpreply-mc/.unikraft/unikraft
          git -C samples/httpreply-mc/.unikraft/unikraft checkout e31b2c44effe583eb8910e713fda814b6e049213

      - name: Fetch pinned lib-lwip source
        run: |
          git clone https://github.com/unikraft/lib-lwip.git samples/httpreply-mc/.libs/lib-lwip
          git -C samples/httpreply-mc/.libs/lib-lwip checkout ec55ae17618feeb57c8c10109bcf5c42723e8e95

      - name: Apply and verify submodule patches
        run: |
          samples/httpreply-mc/scripts/apply_patches.sh

      - name: Generate configuration from defconfig
        run: |
          cd samples/httpreply-mc
          cp defconfig .config
          make olddefconfig

      - name: Build multi-core sample
        run: |
          cd samples/httpreply-mc
          make

