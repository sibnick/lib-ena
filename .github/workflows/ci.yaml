name: ci

on:
  push:
  pull_request:

jobs:
  host:
    name: host unit tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run unit tests
        run: make clean && make test

      - name: Run sanitizer build
        run: make sanitize

  unikraft-x86_64:
    name: unikraft build (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install KraftKit
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get.kraftkit.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure KraftKit manifests
        run: |
          kraft pkg source add https://manifests.kraftkit.sh/index.yaml
          kraft pkg update

      - name: Build ENA application for KVM/QEMU x86_64
        run: |
          kraft build --target kvm --plat qemu --arch x86_64 examples/ci-app

  unikraft-arm64:
    name: unikraft build (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install aarch64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install KraftKit
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://get.kraftkit.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure KraftKit manifests
        run: |
          kraft pkg source add https://manifests.kraftkit.sh/index.yaml
          kraft pkg update

      - name: Build ENA application for KVM/QEMU arm64
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          kraft build --target kvm --plat qemu --arch arm64 examples/ci-app
